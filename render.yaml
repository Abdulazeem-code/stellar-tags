databases:
  - name: stellar-tags-db
    databaseName: stellar_tags
    user: stellar_tags
    plan: basic-256mb

services:
  - type: web
    name: stellar-tags-api
    runtime: docker
    dockerfilePath: ./Dockerfile-backend
    dockerContext: .
    autoDeployTrigger: commit
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_DIR
        value: /app/logs
      - key: DATABASE_URL
        fromDatabase:
          name: stellar-tags-db
          property: connectionString
      # Run the Horizon listener inside the API so payment requests turn to
      # "paid" without a separate worker. Keep this service at one instance:
      # each instance would run its own listener and duplicate webhooks.
      - key: RUN_HORIZON_LISTENER
        value: "true"
