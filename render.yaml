databases:
  - name: stellar-tags-db
    databaseName: stellar_tags
    user: stellar_tags
    plan: basic-256mb

services:
  - type: web
    name: stellar-tags-api
    runtime: docker
    dockerfilePath: ./Dockerfile-backend
    dockerContext: .
    autoDeployTrigger: commit
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_DIR
        value: /app/logs
      - key: DATABASE_URL
        fromDatabase:
          name: stellar-tags-db
          property: connectionString