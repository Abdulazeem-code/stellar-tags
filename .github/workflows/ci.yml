name: Production Safety Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./stellar-payment-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./stellar-payment-platform/package-lock.json


      - name: Install Backend Dependencies
        run: npm install

      # Run the full suite with coverage so the thresholds in package.json
      # fail the build whenever coverage regresses below the floor.
      - name: Run Backend Tests (with coverage thresholds)
        run: NODE_ENV=test npm run test:coverage

      - name: Upload Coverage Report
        # Upload even when the thresholds fail, so the drop is visible in the
        # artifact (see stellar-payment-platform/coverage/lcov-report/).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: stellar-payment-platform/coverage
          retention-days: 14

      - name: Run Memory Leak Detection Tests (#511)
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPathPattern=memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'

  backend-integration:
    name: Backend Integration (Testcontainers)
    runs-on: ubuntu-latest
    # Booting PostgreSQL and Redis, applying the migration chain and running the
    # container-backed suites takes a few minutes; fail loudly rather than hang.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./stellar-payment-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./stellar-payment-platform/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      # GitHub-hosted runners have a working Docker daemon, so this phase starts
      # real PostgreSQL 16 and Redis 7 containers (the same versions
      # docker-compose.yml runs in development) instead of falling back to
      # TEST_DATABASE_URL / TEST_REDIS_URL. tests/containers/globalSetup.js
      # applies the Prisma migration chain to the fresh database, so a chain that
      # is not valid SQL fails the job before a single assertion runs.
      - name: Run Integration Tests Against Real PostgreSQL and Redis (#686)
        run: npm run test:integration -- --ci 2>&1 | tee integration-test.log
        env:
          NODE_ENV: test

      - name: Upload Integration Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-log
          path: stellar-payment-platform/integration-test.log
          retention-days: 7

  frontend-checks:
    name: Frontend Vercel Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./payment-dashboard/package-lock.json
          
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Verify Vite Build (Catches Vercel Crashes)
        run: npm run build