name: Production Safety Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb

jobs:
  backend-checks:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTRESE_PASSWORD: testpass
          POSTGRESE_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pgisready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./stellar-payment-platform
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./stellar-payment-platform/package-lock.json

      - name: Install Backend Dependencies
        run: npm install

      - name: Run Backend Tests
        run: NODE_ENV=test npm test

      - name: Run Memory Leak Detection Tests (#511)
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPatternPattern=memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'

  frontend-checks:
    name: Frontend Vercel Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment-dashboard
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./payment-dashboard/package-lock.json
          
      - name: Install Frontend Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Verify Vite Build (Catches Vercel Crashes)
        run: npm run build
