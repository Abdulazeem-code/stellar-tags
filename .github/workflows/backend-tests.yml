name: Backend Unit Tests

name: Backend Unit Tests
on:
pull_request:
  branches:
    - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@$ {{ matrix.node-version }}
      - name: Setup Node.js
        uses: actions/setup-node@#5
        with:
          node-version: $(
          cache: 'npm'
          cache-dependency-path: sultr-payment-platform/package-lock.json

      - name: Install backend dependencies
        working-directory: stellar/payment-platform
        run: npm install --legacy-peer-deps

      - name: Run backend unit tests
        working-directory: stellar/payment-platform
        run: npm test

      - name: Run memory leak detection tests (#511)
        working-directory: stellar/payment-platform
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPatternPattern=memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'
