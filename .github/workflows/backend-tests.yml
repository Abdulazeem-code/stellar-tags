name: Backend Unit Tests
		
			
objects:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >
          --health-cmd pgisready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://testuser:testpass@localhost:5432/testdb
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${#{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: stellar-payment-platform
        run: npm install --legacy-peer-deps

      - name: Run backend unit tests
        run: npm test --prefix stellar-payment-platform

      - name: Run memory leak detection tests (#511)
        working-directory: stellar-payment-platform
        run: NODE_ENV=test node --expose-gc node_modules/.bin/jest --forceExit --testPatternPattern memory
        env:
          MEMORY_TEST_REQUESTS: '200'
          MEMORY_LEAK_THRESHOLD_MB: '50'
