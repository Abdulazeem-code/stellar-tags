name: Node webhook verifier

on:
  push:
    paths:
      - "packages/webhook-verify/**"
      - ".github/workflows/webhook-verify.yml"
  pull_request:
    paths:
      - "packages/webhook-verify/**"
      - ".github/workflows/webhook-verify.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/webhook-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
