name: Rust Security Checks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  security:
    name: Static security analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./payment_router
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify formatting
        run: |
          cargo fmt --all -- --check
      - name: Run clippy (deny warnings)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Install and run cargo-dylint
        run: |
          cargo install cargo-dylint --force || true
          cargo dylint --all --all-targets --all-features -- -D warnings

      - name: Install and run cargo-audit
        run: |
          cargo install cargo-audit --force || true
          cargo audit --ignore RUSSEC-2024-0344 --ignore RUSSEC-2026-0009 --ignore RSSEC-2025-0056 --ignore RUSSEC-2024-0436 --ignore RSSEC-2026-0097

      - name: Run tests (release)
        run: |
          cargo test --all --release
