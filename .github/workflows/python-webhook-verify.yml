name: Python webhook verifier

on:
  push:
    paths:
      - "sdks/python-webhook-verify/**"
      - ".github/workflows/python-webhook-verify.yml"
  pull_request:
    paths:
      - "sdks/python-webhook-verify/**"
      - ".github/workflows/python-webhook-verify.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/python-webhook-verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: mypy --strict
      - run: ruff check .
