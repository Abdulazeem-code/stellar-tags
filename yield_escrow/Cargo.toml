[package]
name = "yield_escrow"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "20.0.0"
# Pinned alongside the payment router: stellar-xdr 20.x needs the 1.3.2
# arbitrary/derive_arbitrary pair, newer releases fail to compile.
derive_arbitrary = "=1.3.2"

# Reuse the same vendored ethnum pin as the payment router: the toolchain used
# by CI does not build the upstream 1.x releases, and keeping both contracts on
# an identical patch keeps `cargo test` reproducible across the two crates.
[patch.crates-io]
ethnum = { path = "../payment_router/ethnum-patch" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
