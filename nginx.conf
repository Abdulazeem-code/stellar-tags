server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # #730 — Server-Sent Events: long-lived payment status streams. Without
    # these directives nginx buffers the upstream response (events would sit
    # in a buffer instead of reaching the client) and would cut the stream at
    # the default 60s read timeout. `proxy_pass` carries no URI so the request
    # path reaches the API unchanged and its own /api/v1 mounts still match.
    location ~ ^/api/.*payments/[^/]+/events$ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
